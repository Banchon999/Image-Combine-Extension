<!doctype html>
<!--
  Mirrors the real webtoons.com series list markup: ul#_listUl containing
  li._episodeItem elements whose episode number lives in data-episode-no.
  Hand-built rather than a saved copy of the site, so it stays small and
  carries no page content.
-->
<html><head>
<meta property="og:title" content="Test Series">
<meta property="og:description" content="A summary.">
<meta property="og:image" content="https://cdn.example/cover.jpg">
</head><body>
<div class="author_area"><span class="author">Some Author</span></div>
<ul id="_listUl">
  <li class="_episodeItem detail_list_item" id="episode_3" data-episode-no="3">
    <a href="https://www.webtoons.com/en/g/s/ep-3/viewer?title_no=7&amp;episode_no=3" class="detail_list_link">
      <span class="thmb"><img src="https://cdn.example/t3.jpg"></span>
      <span class="subj"><span>Episode Three</span></span>
      <span class="date">Mar 3, 2024</span>
    </a>
  </li>
  <li class="_episodeItem detail_list_item" id="episode_2" data-episode-no="2">
    <a href="https://www.webtoons.com/en/g/s/ep-2/viewer?title_no=7&amp;episode_no=2" class="detail_list_link">
      <span class="thmb"><img src="https://cdn.example/t2.jpg"></span>
      <span class="subj"><span>Episode Two</span></span>
      <span class="date">Mar 2, 2024</span>
    </a>
  </li>
</ul>
<div class="paginate">
  <a href="/en/g/s/list?title_no=7&amp;page=2">2</a>
  <a href="/en/g/s/list?title_no=7&amp;page=3">3</a>
</div>
</body></html>
